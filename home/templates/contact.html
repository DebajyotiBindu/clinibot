<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLPROJECT18 // COMM_CHANNEL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');

        :root {
            --bg: #030303;
            --text: #e0e0e0;
            --accent: #00f2ff;
            --dim: #333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .terminal-box {
            width: 90%;
            max-width: 600px;
            padding: 3rem;
            border: 1px solid var(--dim);
            background: #0a0a0a;
        }

        h2 { color: var(--accent); margin-top: 0; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: var(--accent); font-size: 0.8rem; }
        
        input, textarea {
            width: 100%;
            background: transparent;
            border: 1px solid var(--dim);
            color: white;
            padding: 10px;
            box-sizing: border-box;
            font-family: 'JetBrains Mono', monospace;
        }
        
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }

        button {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            transition: 0.3s;
        }
        
        button:hover { background: var(--accent); color: black; }

        .back-link { display: block; margin-top: 20px; font-size: 0.8rem; color: var(--dim); text-decoration: none; }
        .back-link:hover { color: var(--text); }
    </style>
</head>
<body>

    <div class="terminal-box">
        <h2> INITIATE_COMMUNICATION</h2>
        <form action="{% url 'contact' %}" method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>EMAIL_ADDRESS</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label>TOPIC</label>
                <input type="text" name="topic" required>
            </div>

            <div class="form-group">
                <label>MESSAGE_BODY</label>
                <textarea name="description" rows="5" required></textarea>
            </div>

            <button type="submit">SEND_PACKET()</button>
        </form>

        <a href="/" class="back-link">&larr; BACK_TO_ROOT</a>
    </div>

</body>
</html>
