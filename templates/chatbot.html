<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLPROJECT18 // CHAT_INTERFACE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');
        :root { --bg: #030303; --accent: #00f2ff; --dim: #333; --text: #e0e0e0; }

        body { background-color: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; margin: 0; padding: 20px; display: flex; justify-content: center; }

        .terminal-box { width: 100%; max-width: 700px; padding: 2rem; border: 1px solid var(--dim); background: #0a0a0a; margin-top: 50px; }
        h2 { color: var(--accent); margin-top: 0; font-size: 1.2rem; }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px;
            color: var(--accent);
            font-size: 0.8rem;
        }
        .dot { animation: blink 1.4s infinite both; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0; } 40% { opacity: 1; } }

        #chat-window { height: 400px; overflow-y: auto; border: 1px solid var(--dim); padding: 15px; margin-bottom: 20px; background: #050505; }
        .message { margin-bottom: 15px; padding: 10px; border-left: 2px solid var(--dim); }
        .user-msg { color: #aaa; text-align: right; border-left: none; border-right: 2px solid var(--dim); }
        .bot-msg { color: var(--accent); }

        .input-area { display: flex; gap: 10px; }
        input { flex-grow: 1; background: transparent; border: 1px solid var(--dim); color: white; padding: 10px; }
        button { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 10px 20px; cursor: pointer; }
        button:hover { background: var(--accent); color: black; }

        /* Modified: Back to Root option with smooth white glow effect on hover */
        .back-root {
            display: block; 
            margin-top: 20px; 
            color: var(--dim); 
            font-size: 0.8rem; 
            text-decoration: none;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }
        .back-root:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="terminal-box">
        <h2>./EXECUTE_CHATBOT</h2>
        <h3>Ask me anything regarding Debajyoti and his works</h3>
        <div id="chat-window"></div>
        <div class="input-area">
            <input type="text" id="query" placeholder="Enter query...">
            <button onclick="sendMessage()">SEND_QUERY()</button>
        </div>
        <a href="/" class="back-root">&larr; BACK_TO_ROOT</a>
    </div>

    <script>
        async function sendMessage() {
            const queryInput = document.getElementById('query');
            const chatWindow = document.getElementById('chat-window');
            const query = queryInput.value;
            if (!query) return;

            // 1. Display user message
            chatWindow.innerHTML += `<div class="message user-msg">> ${query}</div>`;
            queryInput.value = '';

            // 2. Add "Thinking" indicator while waiting for the network response
            const loader = document.createElement('div');
            loader.className = 'typing-indicator';
            loader.innerHTML = 'AI is thinking<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
            chatWindow.appendChild(loader);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // 3. Send to Django backend and await reply
            const response = await fetch('/chatbot/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({ query: query })
            });
            const data = await response.json();
            const fullText = data.response;

            // 4. Remove the thinking indicator immediately now that data is ready
            if (loader && loader.parentNode) {
                loader.parentNode.removeChild(loader);
            }

            // 5. Create empty bot message container
            const botMsgDiv = document.createElement('div');
            botMsgDiv.className = 'message bot-msg';
            botMsgDiv.innerHTML = 'AI: ';
            chatWindow.appendChild(botMsgDiv);

            // 6. Execution of the Typing Effect
            let i = 0;
            function typeWriter() {
                if (i < fullText.length) {
                    let char = fullText.charAt(i);
                    botMsgDiv.innerHTML += char === '\n' ? '<br>' : char;
                    i++;
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                    setTimeout(typeWriter, 15);
                }
            }
            typeWriter();
        }
    </script>
</body>
</html>
